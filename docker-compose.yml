services:
  db:
    image: postgres:16-alpine
    container_name: auditable-metrics-db
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: auditable-metrics-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/metrics
      DATABASE_CONNECT_RETRIES: 20
      DATABASE_CONNECT_RETRY_SECONDS: 2
      DEFAULT_DATA_SOURCE_LABEL: mock_database
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: auditable-metrics-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:

